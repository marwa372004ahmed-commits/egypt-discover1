    <section>

<h2>Egypt Explorer Map</h2>

<div class="progress">
<div id="progressBar"></div>
</div>

<p id="progressText">0% of Egypt discovered</p>

<div id="map"></div>

</section>
<section class="cards-section">
  <h2 class="text-2xl font-bold mb-6">Explore Places</h2>

  <div id="placesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
  </div>
</section>
<script>

/* Map */

var map = L.map('map').setView([31.2001,29.9187],12)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'Egypt Explorer'
}).addTo(map)


let visited = 0
let places = []


const visitedIcon = L.icon({
iconUrl:'https://maps.gstatic.com/mapfiles/ms2/micons/yellow-dot.png',
iconSize:[32,32]
})


function visitPlace(marker){

if(!marker.visited){

marker.visited = true
visited++

marker.setIcon(visitedIcon)

updateProgress()

}

}


function updateProgress(){

let percent = Math.round((visited / places.length) * 100)

document.getElementById("progressBar").style.width = percent + "%"
document.getElementById("progressText").innerText = percent + "% of Egypt discovered"

}



/* Function to create places */

function createPlace(name, lat, lng, image){

let marker = L.marker([lat,lng]).addTo(map)

marker.bindPopup(`
  <div style="width:200px; text-align:center">
    <img src="${image}" style="width:100%; height:120px; object-fit:cover; border-radius:10px; margin-bottom:8px;">
    <h4 style="font-weight:bold; margin-bottom:6px;">${name}</h4>
    <button onclick="visitPlace(window['${name.replace(/\s/g,'')}'])">
      Visit
    </button>
  </div>
`)

window[name.replace(/\s/g,'')] = marker
places.push(marker)

/* ✅ إضافة الكارت تحت الخريطة */

const container = document.getElementById("placesContainer")

const card = document.createElement("div")
card.className = "bg-white dark:bg-[#1a1a1a] rounded-xl shadow-lg overflow-hidden"

card.innerHTML = `
  <div class="flex items-center gap-4 p-4">
    
    <img src="${image}" 
      class="w-24 h-24 object-cover rounded-lg">

    <div class="flex-1 text-left">
      <h3 class="font-bold text-lg mb-2">${name}</h3>
      
      <button onclick="goToPlace(${lat}, ${lng}, '${name.replace(/\s/g,'')}')"
        class="bg-primary px-4 py-2 rounded-lg text-black font-semibold">
        Visit
      </button>
    </div>

  </div>
`

container.appendChild(card)

}
function goToPlace(lat, lng, markerName){

map.setView([lat, lng], 13)

let marker = window[markerName]

if(marker){
marker.openPopup()
}

}

/* Alexandria */

createPlace("Bibliotheca Alexandrina",31.2089,29.9092,"/photo/bibliotheca.jpg")

createPlace("Qaitbay Citadel",31.2135,29.8853,"/photo/qaitbay.jpg")

createPlace("Montaza Palace",31.2820,30.0125,"/photo/montaza.jpg")

createPlace("Pompey's Pillar",31.1820,29.8969,"/photo/pompey.jpg")

createPlace("Roman Theatre",31.2001,29.9033,"/photo/roman theatre.jpg")

createPlace("Alexandria Corniche",31.2156,29.9553,"/photo/corniche.jpg")

createPlace("Stanley Bridge",31.2450,29.9660,"/photo/stanley.jpg")
const toggleBtn = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

// تحميل الثيم المحفوظ
if (
  localStorage.getItem("theme") === "dark" ||
  (!localStorage.getItem("theme") &&
    window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");

  if (icon) {
    icon.textContent = "light_mode";
  }
} else {
  document.documentElement.classList.remove("dark");

  if (icon) {
    icon.textContent = "dark_mode";
  }
}

// تغيير الوضع
if (toggleBtn) {
  toggleBtn.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");

    if (document.documentElement.classList.contains("dark")) {
      localStorage.setItem("theme", "dark");

      if (icon) {
        icon.textContent = "light_mode";
      }
    } else {
      localStorage.setItem("theme", "light");

      if (icon) {
        icon.textContent = "dark_mode";
      }
    }
  });
}
/////ت
setInterval(() => {
  const before = new Date().getTime();
  debugger;
  const after = new Date().getTime();

  if (after - before > 100) {
    document.body.innerHTML = "";
    window.location.href = "about:blank";
  }
}, 1000);

document.addEventListener('contextmenu', e => e.preventDefault());

document.onkeydown = function(e) {
  if (
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    return false;
  }
};

</script>
