<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Egypt Discover | Feedback</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Manrope", sans-serif;
      background: #0a0a0a;
      overflow-x: hidden;
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(236, 182, 19, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }

    .glass {
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(236, 182, 19, 0.15);
    }

    .star {
      cursor: pointer;
      transition: 0.3s;
    }

    .star.active {
      color: #ecb613;
      transform: scale(1.1);
    }

    textarea {
      resize: none;
    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 py-10">

  <div class="bg-pattern"></div>

  <div class="glass relative w-full max-w-3xl rounded-3xl p-8 shadow-2xl">

    <!-- Header -->
    <div class="text-center mb-10">

      <h1 class="text-5xl font-black text-[#ecb613] mb-4">
        Egypt Discover
      </h1>

      <p class="text-gray-400 text-lg">
        Share your experience with us ✨
      </p>

    </div>

    <!-- Form -->
    <form id="feedbackForm" class="space-y-6">

      <div>
        <label class="block mb-2 text-sm text-gray-400">
          Your Comment
        </label>

        <textarea
          id="comment"
          required
          placeholder="Tell us about your experience..."
          class="w-full h-40 rounded-2xl bg-[#121212] border border-[#393528] px-5 py-4 text-white outline-none focus:border-[#ecb613] transition-all"
        ></textarea>
      </div>

      <!-- Rating -->
      <div>

        <label class="block mb-3 text-sm text-gray-400">
          Rate Your Experience
        </label>

        <div class="flex gap-3 text-4xl" id="stars">

          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>

        </div>

      </div>

      <!-- Button -->
      <button
        type="submit"
        id="submitBtn"
        class="w-full bg-[#ecb613] hover:bg-yellow-400 text-black font-bold py-4 rounded-2xl transition-all duration-300 text-lg"
      >
        Send Feedback
      </button>

    </form>

    <!-- Message -->
    <div
      id="responseMessage"
      class="hidden mt-6 text-center font-semibold text-lg"
    ></div>

  </div>

  <script>

    const stars = document.querySelectorAll(".star");
    let selectedRating = 0;

    stars.forEach(star => {

      star.addEventListener("click", () => {

        selectedRating = star.dataset.value;

        stars.forEach(s => {
          s.classList.remove("active");

          if (s.dataset.value <= selectedRating) {
            s.classList.add("active");
          }
        });

      });

    });

    const form = document.getElementById("feedbackForm");
    const responseMessage = document.getElementById("responseMessage");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (e) {

      e.preventDefault();

      const comment = document.getElementById("comment").value;

      if (selectedRating == 0) {

        responseMessage.classList.remove("hidden");
        responseMessage.style.color = "#ef4444";

        responseMessage.innerHTML =
          "Please select a rating between 1 and 5.";

        return;
      }

      submitBtn.innerHTML = "Sending...";
      submitBtn.disabled = true;

      try {

const token = localStorage.getItem("token");

const response = await fetch(
  "https://egyptdiscover2.runasp.net/api/Feedback",
  {
    method: "POST",

    headers: {
      "Content-Type": "application/json",

      "Authorization": `Bearer ${token}`
    },

    body: JSON.stringify({
      comment: comment,
      rating: Number(selectedRating)
    })
  }
);

        const data = await response.text();

        if (response.ok) {

          responseMessage.classList.remove("hidden");
          responseMessage.style.color = "#22c55e";

          responseMessage.innerHTML =
            "✅ Feedback sent successfully!";

          form.reset();

          stars.forEach(s => s.classList.remove("active"));

          selectedRating = 0;

        } else {

          responseMessage.classList.remove("hidden");
          responseMessage.style.color = "#ef4444";

          responseMessage.innerHTML = data;
        }

      } catch (error) {

        responseMessage.classList.remove("hidden");
        responseMessage.style.color = "#ef4444";

        responseMessage.innerHTML =
          "Server connection error.";

        console.error(error);
      }

      submitBtn.innerHTML = "Send Feedback";
      submitBtn.disabled = false;

    });

document.onkeydown = function(e) {
  if (
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    return false;
  }
};

  </script>
<script src="auth.js"></script>
</body>
</html>
