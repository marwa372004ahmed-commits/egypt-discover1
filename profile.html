<script>
const BASE_URL = "https://egyptdiscover2.runasp.net";

async function sendData() {
  const token = localStorage.getItem("token");

  if (!token) {
    alert("اعملي login الأول ❗");
    return;
  }

  const phone = document.getElementById("phoneInput").value;
  const city = document.getElementById("cityInput").value;
  const address = document.getElementById("addressInput").value;

  if (!phone || !city || !address) {
    alert("املي البيانات المطلوبة ❗");
    return;
  }

  try {
    const res = await fetch(`${BASE_URL}/api/Orders/Checkout/Create-Order`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phoneNumber: phone,
        city: city,
        address: address,
        paymentMethod: "CashOnDelivery"
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "فشل الطلب ❌");
      return;
    }

    alert("تم الطلب بنجاح 🎉");

  } catch (err) {
    console.error(err);
    alert("حصل خطأ ❗");
  }
}


async function getProfile() {
  const token = localStorage.getItem("token");

  try {
    const res = await fetch(`${BASE_URL}/api/Profile/profile`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/json"
      }
    });

    const data = await res.json();

    document.getElementById("fullName").value = data.fullName || "";
    document.getElementById("username").value = data.userName || "";
    document.getElementById("email").value = data.email || "";
    document.getElementById("phone").value = data.phoneNumber || "";
    document.getElementById("dob").value = data.dateOfBirth || "";
    document.getElementById("country").value = data.country || "";

  } catch (err) {
    console.log(err);
  }
}

window.onload = function () {
  getProfile();
};
const toggleBtn = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

// تحميل الثيم المحفوظ
if (
  localStorage.getItem("theme") === "dark" ||
  (!localStorage.getItem("theme") &&
    window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");

  if (icon) {
    icon.textContent = "light_mode";
  }
} else {
  document.documentElement.classList.remove("dark");

  if (icon) {
    icon.textContent = "dark_mode";
  }
}

// تغيير الوضع
if (toggleBtn) {
  toggleBtn.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");

    if (document.documentElement.classList.contains("dark")) {
      localStorage.setItem("theme", "dark");

      if (icon) {
        icon.textContent = "light_mode";
      }
    } else {
      localStorage.setItem("theme", "light");

      if (icon) {
        icon.textContent = "dark_mode";
      }
    }
  });
}
/////ت
setInterval(() => {
  const before = new Date().getTime();
  debugger;
  const after = new Date().getTime();

  if (after - before > 100) {
    document.body.innerHTML = "";
    window.location.href = "about:blank";
  }
}, 1000);

document.addEventListener('contextmenu', e => e.preventDefault());

document.onkeydown = function(e) {
  if (
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    return false;
  }
};

</script>
