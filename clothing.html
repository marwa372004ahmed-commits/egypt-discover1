<script>

/* Cursor Glow */
document.addEventListener("mousemove", e => {
  let glow = document.getElementById("cursorGlow");
  glow.style.left = e.clientX + "px";
  glow.style.top = e.clientY + "px";
});

/* Scroll Animation */
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show-anim");
    }
  });
});

document.querySelectorAll(".hidden-anim").forEach(el => observer.observe(el));

/* 3D Models */
function loadModel(type) {
  document.getElementById("model").scrollIntoView({behavior:"smooth"});
  
  const sound = document.getElementById("clickSound");
  sound.currentTime = 0;
  sound.play();

  let viewer = document.getElementById("viewer");

  if(type==="dress"){
    viewer.src = "/3D/source/tut hunyuan.glb";
  }

  if(type==="pharaoh"){
    viewer.src = "/3D 2/pyramid_of_menkaure_giza_pyramid_complex_egypt.glb";
  }

  if(type==="priest"){
    viewer.src = "/3D/source/tut hunyuan.glb";
  }
}

/* Favorite */
function toggleFav(el){
  el.style.color = el.style.color === "red" ? "white" : "red";
}
const toggleBtn = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

// تحميل الثيم المحفوظ
if (
  localStorage.getItem("theme") === "dark" ||
  (!localStorage.getItem("theme") &&
    window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");

  if (icon) {
    icon.textContent = "light_mode";
  }
} else {
  document.documentElement.classList.remove("dark");

  if (icon) {
    icon.textContent = "dark_mode";
  }
}

// تغيير الوضع
if (toggleBtn) {
  toggleBtn.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");

    if (document.documentElement.classList.contains("dark")) {
      localStorage.setItem("theme", "dark");

      if (icon) {
        icon.textContent = "light_mode";
      }
    } else {
      localStorage.setItem("theme", "light");

      if (icon) {
        icon.textContent = "dark_mode";
      }
    }
  });
}
/////ت
setInterval(() => {
  const before = new Date().getTime();
  debugger;
  const after = new Date().getTime();

  if (after - before > 100) {
    document.body.innerHTML = "";
    window.location.href = "about:blank";
  }
}, 1000);

document.addEventListener('contextmenu', e => e.preventDefault());

document.onkeydown = function(e) {
  if (
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    return false;
  }
};

</script>
