<script>
const container = document.getElementById("products");
const cartBadge = document.getElementById("cart-counter");
const BASE_URL = "https://egyptdiscover2.runasp.net/";

// 🔥 state
let products = [];
let cart = [];
let allProducts = [];

// =======================
// 🟢 تحميل المنتجات
// =======================
async function getProducts() {
  try {
    //  1. حمّل من localStorage (ده الأساس)
    const savedCart = localStorage.getItem("cart");
    if (savedCart) {
      cart = JSON.parse(savedCart);
      updateCartCount();
    }

    //  2. هات المنتجات
    const res = await fetch("https://egyptdiscover2.runasp.net/api/Category/Get%20All%20Category%20With%20Products");
    const data = await res.json();

products = data.flatMap(cat => cat.products);
allProducts = [...products];
    displayProducts();

    //  3. متشغليش السيرفر غير لو الكارت فاضي
    if (cart.length === 0) {
      await loadCart();
      displayProducts();
    }

  } catch (err) {
    console.log(err);
  }
}

// =======================
//  تحميل الكارت
// =======================
async function loadCart() {
  const token = localStorage.getItem("token");
  if (!token) return;

  try {
    const res = await fetch(`${BASE_URL}api/Cart/MyCart`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    const data = await res.json();
    const serverItems = data.items || data.data || [];

    // ❗ أهم سطر هنا
    if (!serverItems.length) return;

    cart = serverItems.map(item => ({
      productId: item.productId || item.id,
      quantity: item.quantity
    }));

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();

  } catch (err) {
    console.log(err);
  }
}
// =======================
// 🟢 عرض المنتجات
// =======================
function displayProducts() {
  container.innerHTML = "";

  products.forEach(product => {
    const item = cart.find(i => Number(i.productId) === Number(product.id));
    const qty = item ? item.quantity : 0;

    const div = document.createElement("div");
    div.classList.add("card");

    div.innerHTML = `
      <img src="${BASE_URL + product.imageUrl}" />

      <div class="content">
        <div class="title">${product.name}</div>
          <div class="desc">${product.description}</div>
          <div class="desc">${product.stock}</div>
        <div class="price">${product.price} EGP</div>

        <div id="btn-${product.id}">
          ${
            qty > 0
              ? `
                <div class="flex items-center gap-2 mt-2">
                  <button class="bg-primary/20 px-3 py-1 rounded" onclick="changeQty(${product.id}, -1)">-</button>
                  <span id="qty-${product.id}" class="font-bold">${qty}</span>
                  <button class="bg-primary/20 px-3 py-1 rounded" onclick="changeQty(${product.id}, 1)">+</button>
                </div>
              `
              : `
                <button class="btn" onclick="addToCart(${product.id})">
                  Add to Cart
                </button>
              `
          }
        </div>
      </div>
    `;

    container.appendChild(div);
  });
}


// =======================
// 🟢 إضافة للكارت
// =======================
async function addToCart(productId) {

  const token = localStorage.getItem("token");

if (
  !token ||
  token === "null" ||
  token === "undefined" ||
  token.trim() === ""
) {

  alert("Please login first 🛒");

  window.location.href = "/login.html";

  return;
}

  // ✅ إضافة المنتج
  let item = cart.find(
    i => Number(i.productId) === Number(productId)
  );

  if (item) {
    item.quantity += 1;
  } else {
    cart.push({
      productId,
      quantity: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  displayProducts();

  updateCartCount();

  try {

    await fetch(
      `${BASE_URL}api/Cart/add-item-to-cart?productId=${productId}&quantity=1`,
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

  } catch (err) {
    console.log(err);
  }
}
// =======================
// 🟢 تغيير الكمية
// =======================
async function changeQty(productId, change) {
  const token = localStorage.getItem("token");
  if (!token) return showLoginModal();

  let item = cart.find(i => Number(i.productId) === Number(productId));
  if (!item) return;

  item.quantity += change;

  if (item.quantity <= 0) {
    cart = cart.filter(i => Number(i.productId) !== Number(productId));
    localStorage.setItem("cart", JSON.stringify(cart));
    displayProducts();
    updateCartCount();

    try {
      await fetch(`${BASE_URL}api/Cart/remove-item-from-cart?productId=${productId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });
    } catch (err) {
      console.log(err);
    }
  } else {
    localStorage.setItem("cart", JSON.stringify(cart));
    displayProducts();
    updateCartCount();

    try {
      await fetch(`${BASE_URL}api/Cart/update-item-in-cart?productId=${productId}&quantity=${item.quantity}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });
    } catch (err) {
      console.log(err);
    }
  }
}

// =======================
// 🟢 تحديث العداد
// =======================
function updateCartCount() {
  const total = cart.reduce((sum, item) => sum + item.quantity, 0);

  if (total === 0) {
    cartBadge.classList.add("hidden");
  } else {
    cartBadge.classList.remove("hidden");
    cartBadge.textContent = total > 99 ? "+99" : total;
  }
}

// =======================
// تشغيل
// =======================
getProducts();

// =======================
// مودال
// =======================
function showLoginModal() {
  document.getElementById("loginModal").classList.remove("hidden");
}

function closeLoginModal() {
  document.getElementById("loginModal").classList.add("hidden");
}

function goToLogin() {
  window.location.href = "/login.html";
}
window.addEventListener("message", (event) => {
  if (event.data === "login-success") {
    closeLoginModal();
    location.reload();
  }
});
const toggleBtn = document.getElementById("themeToggle");
const icon = document.getElementById("themeIcon");

// تحميل الثيم المحفوظ
if (
  localStorage.getItem("theme") === "dark" ||
  (!localStorage.getItem("theme") &&
    window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");

  if (icon) {
    icon.textContent = "light_mode";
  }
} else {
  document.documentElement.classList.remove("dark");

  if (icon) {
    icon.textContent = "dark_mode";
  }
}

// تغيير الوضع
if (toggleBtn) {
  toggleBtn.addEventListener("click", () => {
    document.documentElement.classList.toggle("dark");

    if (document.documentElement.classList.contains("dark")) {
      localStorage.setItem("theme", "dark");

      if (icon) {
        icon.textContent = "light_mode";
      }
    } else {
      localStorage.setItem("theme", "light");

      if (icon) {
        icon.textContent = "dark_mode";
      }
    }
  });
}
///////*عمليات تسجيل الدخول ///
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");

const profileContainer =
  document.getElementById("profileContainer");

const dashboardLink =
  document.getElementById("dashboardLink");

const logoutMenuBtn =
  document.getElementById("logoutMenuBtn");

if (token) {

  loginBtn?.classList.add("hidden");
  registerBtn?.classList.add("hidden");

  profileContainer?.classList.remove("hidden");

  if (role === "Admin") {
    dashboardLink?.classList.remove("hidden");
  }

} else {

  profileContainer?.classList.add("hidden");
}

logoutMenuBtn?.addEventListener("click", () => {

  localStorage.clear();

  window.location.href = "/home.html";
});
const profileBtn = document.getElementById("profileBtn");
const profileMenu = document.getElementById("profileMenu");

if (profileBtn && profileMenu) {

  profileBtn.addEventListener("click", (e) => {

    e.stopPropagation();

    profileMenu.classList.toggle("hidden");

  });

  document.addEventListener("click", (e) => {

    if (!profileBtn.contains(e.target) &&
        !profileMenu.contains(e.target)) {

      profileMenu.classList.add("hidden");

    }

  });

}
async function loadOrdersCount() {

  const token = localStorage.getItem("token");

  if (!token) return;

  try {

    const response = await fetch(
      "https://egyptdiscover2.runasp.net/api/Orders/My-Orders",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    if (!response.ok) return;

    const orders = await response.json();

    const badge = document.getElementById("ordersCount");

    badge.textContent = orders.length;

    if (orders.length > 0) {
      badge.classList.remove("hidden");
    }

  } catch (error) {

    console.error(error);

  }
}

loadOrdersCount();

setInterval(() => {
  const before = new Date().getTime();
  debugger;
  const after = new Date().getTime();

  if (after - before > 100) {
    document.body.innerHTML = "";
    window.location.href = "about:blank";
  }
}, 1000);

document.addEventListener('contextmenu', e => e.preventDefault());

document.onkeydown = function(e) {
  if (
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    return false;
  }
};
